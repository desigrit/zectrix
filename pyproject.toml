[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "note-calendar"
version = "0.1.0"
description = "A reference-style calendar for the Zectrix Note 4c"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Pillow>=11,<13",
  "requests>=2.32,<3",
  "google-auth-oauthlib>=1.2,<2",
  "tzdata>=2025.2",
  "waitress>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
note-calendar = "note_calendar.app:main"

[tool.setuptools.packages.find]
include = ["note_calendar*"]

[tool.setuptools.package-data]
note_calendar = ["static/*", "templates/*", "assets/fonts/*", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
